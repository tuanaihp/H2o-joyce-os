name: Điều khiển app trên máy
slug: desktop-apps
version: 1.0.0
description: Mở, đóng và liệt kê ứng dụng trên CHÍNH MÁY đang chạy Joyce (Windows, macOS, Linux có màn hình) theo lời người dùng, ví dụ "mở Chrome", "tắt Excel", "đang mở app nào". Tự chặn và nói rõ khi Joyce chạy trong Docker trên máy chủ, vì khi đó máy chạy Joyce không phải máy của người dùng.
author: Joyce (bundled)
enabled: true
min_mode: safe
tools:
  - joyce_app_list
  - joyce_app_open
  - joyce_app_close
hooks: []
