name: Điều khiển app trên máy
name_en: "Control apps on this computer"
slug: desktop-apps
version: 1.0.0
description: Mở, đóng và liệt kê ứng dụng trên CHÍNH MÁY đang chạy Joyce (Windows, macOS, Linux có màn hình) theo lời người dùng, ví dụ "mở Chrome", "tắt Excel", "đang mở app nào". Tự chặn và nói rõ khi Joyce chạy trong Docker trên máy chủ, vì khi đó máy chạy Joyce không phải máy của người dùng.
description_en: "Opens, closes and lists apps on THE MACHINE running Joyce (Windows, macOS, Linux with a screen) when you ask, e.g. \"open Chrome\", \"close Excel\", \"which apps are open\". Blocks itself and says so when Joyce runs in Docker on a server, because then the machine running Joyce is not yours."
author: Joyce (bundled)
enabled: true
min_mode: safe
tools:
  - joyce_app_list
  - joyce_app_open
  - joyce_app_close
hooks: []
