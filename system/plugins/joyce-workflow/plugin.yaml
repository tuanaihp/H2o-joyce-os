description: Xem các lần chạy quy trình gần đây và kết quả từng lần, ngay từ chat. Trước tool này, chạy quy trình xong là kết quả mất, hỏi "quy trình chạy gần nhất ra sao" Joyce không có gì để tra.
description_en: "Shows recent workflow runs and the result of each, right from chat. Before this tool a finished workflow's result was lost, and asking \"how did the last workflow run go\" left Joyce nothing to look up."
